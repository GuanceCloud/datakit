syntax = "proto3";

package aggregate.v1;

option go_package = "/;aggregate";

// 数据包：使用连续 PBPoints payload，避免尾采样链路重复解码/编码。
message DataPacket {
  uint64 group_id_hash = 1;
  string raw_group_id  = 2;
  string token         = 3;
  string source        = 4;
  string data_type     = 5;

  int64 config_version = 6;
  bool has_error       = 7;

  string group_key     = 8;
  int32 point_count    = 9;

  int64 trace_start_time_unix_nano = 10;
  int64 trace_end_time_unix_nano  = 11;

  bytes points_payload = 12;
  int64 max_point_time_unix_nano = 13;

  // Compression method of points_payload: 0=raw PBPoints encoding, 1=zstd.
  // Senders must negotiate non-zero methods at the HTTP protocol layer: old
  // readers ignore this field but cannot decode compressed points_payload.
  int32 payload_compression = 14;

  // ---- Span predicate summary of seen spans (OR-aggregated across DataKits
  // by the dataway Ingest merge path) ----
  // Semantics: features of the spans seen when this DataPacket was grouped,
  // evaluated without decompression at dataway decision time; only "seen"
  // data is counted, and after cross-DataKit merging it is the union of all
  // seen DataKits.

  bool pred_error = 15; // any seen span: status="error"
  bool pred_http_error = 16; // any seen span: http_status_code matches 4xx/5xx
  bool pred_biz_error = 17; // any seen span: body_code business error (not "0"/"200")
  bool pred_trace_keep = 18; // any seen span: trace_keep=true

  int64 max_span_duration_us = 19; // max duration (us) of seen spans
  int64 root_duration_us = 20; // duration (us) of the seen root span (parent_id="0"); 0=not seen
  int64 max_nonroot_duration_us = 21; // max duration (us) of seen non-root spans

  // Version of the predicate summary carried by this packet. Zero means the
  // sender did not explicitly mark the summary as complete (legacy packet).
  uint32 predicate_summary_version = 22;
}

// batch packages
message DataBatch {
  string collector_id = 1;
  repeated DataPacket packets = 2;
}
