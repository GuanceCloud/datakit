version = '2'

[run]
go = '1.26'
issues-exit-code = 1

[linters]
default = 'all'
disable = [
  'asasalint',
  'bodyclose',
  'canonicalheader',
  'containedctx',
  'contextcheck',
  'cyclop',
  'copyloopvar',
  'decorder',
  'dupl',
  'dupword',
  'embeddedstructfieldcheck',
  'err113',
  'errcheck',
  'errchkjson',
  'errname',
  'errorlint',
  'exhaustruct',
  'exptostd',
  'fatcontext',
  'forcetypeassert',
  'funcorder',
  'ginkgolinter',
  'gochecknoglobals',
  'gocognit',
  'gocritic',
  'goconst',
  'gocyclo',
  'godoclint',
  'godot',
  'gomoddirectives',
  'gosec',
  'gosmopolitan',
  'govet',
  'importas',
  'inamedparam',
  'interfacebloat',
  'intrange',
  'ireturn',
  'lll',
  'mirror',
  'musttag',
  'iotamixing',
  'maintidx',
  'mnd',
  'modernize',
  'nakedret',
  'nestif',
  'nilerr',
  'nilnil',
  'nilnesserr',
  'nlreturn',
  'noctx',
  'noinlineerr',
  'nolintlint',
  'nonamedreturns',
  'paralleltest',
  'perfsprint',
  'prealloc',
  'predeclared',
  'protogetter',
  'reassign',
  'recvcheck',
  'revive',
  'rowserrcheck',
  'sqlclosecheck',
  'staticcheck',
  'tagalign',
  'tagliatelle',
  'testableexamples',
  'testpackage',
  'testifylint',
  'tparallel',
  'unparam',
  'unqueryvet',
  'varnamelen',
  'wastedassign',
  'wrapcheck',
  'usestdlibvars',
  'usetesting',
  'wsl',
  'wsl_v5'
]

[linters.settings]
[linters.settings.forbidigo]
[[linters.settings.forbidigo.forbid]]
pattern = '^print(ln)?$'

[[linters.settings.forbidigo.forbid]]
pattern = '^spew\.Print(f|ln)?$'

[[linters.settings.forbidigo.forbid]]
pattern = '^spew\.Dump$'

[linters.settings.funlen]
lines = 230
statements = 150

[linters.settings.gocognit]
min-complexity = 50

[linters.settings.goconst]
min-len = 3
min-occurrences = 4

[linters.settings.godox]
keywords = [
  'FIXME'
]

[linters.settings.gomoddirectives]
replace-allow-list = [
  'github.com/abbot/go-http-auth',
  'github.com/go-check/check',
  'github.com/gorilla/mux',
  'github.com/mailgun/minheap',
  'github.com/mailgun/multibuf'
]

[linters.settings.depguard.rules.main]
list-mode = 'lax'
files = ['$all']
allow = ['$all']

[[linters.settings.depguard.rules.main.deny]]
pkg = 'github.com/pkg/errors'
desc = 'use standard library errors'

[linters.settings.lll]
line-length = 150
tab-width = 2

[linters.settings.loggercheck]
zap = true

[linters.settings.importas]
no-unaliased = false

[[linters.settings.importas.alias]]
pkg = 'k8s.io/api/core/v1'
alias = 'corev1'

[[linters.settings.importas.alias]]
pkg = 'k8s.io/api/networking/v1beta1'
alias = 'networkingv1beta1'

[[linters.settings.importas.alias]]
pkg = 'k8s.io/api/extensions/v1beta1'
alias = 'extensionsv1beta1'

[[linters.settings.importas.alias]]
pkg = 'k8s.io/apimachinery/pkg/apis/meta/v1'
alias = 'metav1'

[[linters.settings.importas.alias]]
pkg = 'k8s.io/apimachinery/pkg/api/errors'
alias = 'kubeerror'

[linters.settings.misspell]
locale = 'US'

[linters.settings.staticcheck]
checks = [
  'all',
  '-SA1019'
]

[linters.settings.wsl]
allow-assign-and-anything = true

[linters.exclusions]
generated = 'lax'
paths = [
  'packrd',
  'internal/obfuscate',
  'internal/kubernetes/pkg',
  'scripts',
  'internal/plugins/inputs/dameng/driver',
  'internal/plugins/inputs/kingbase/driver',
  'third_party$',
  'builtin$',
  'examples$'
]

[[linters.exclusions.rules]]
linters = [
  'errcheck',
  'goconst',
  'funlen',
  'godot',
  'stylecheck',
  'wsl',
  'unused',
  'deadcode',
  'unparam',
  'varcheck',
  'gocognit',
  'gocyclo',
  'lll',
  'gosec'
]
path = '(.+)_test.go'

[issues]
max-issues-per-linter = 0
max-same-issues = 0

[formatters]
enable = [
  'gofmt',
  'goimports'
]

[formatters.exclusions]
generated = 'lax'
paths = [
  'third_party$',
  'builtin$',
  'examples$'
]
