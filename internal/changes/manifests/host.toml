version = "1.0.0"

# ========== User and Group Change（Module ID：01） ==========
[[change]]
id = "host_change_01_01"
[change.title]
zh = "新增用户"
en = "Create User"
[change.message]
zh = """共新增 {{.ChangeCount}} 个用户：
{{range $index, $change := .Changes}}
-  用户名： {{.UserName}}
   UID： {{.UID}}
   GID： {{.GID}}
   家目录： {{.HomeDir}}
   登录 Shell： {{.LoginShell}}
{{end}}"""
en = """{{.ChangeCount}} users created:
{{range $index, $change := .Changes}}
-  Username: {{.UserName}}
   UID: {{.UID}}
   GID: {{.GID}}
   Home Directory: {{.HomeDir}}
   Login Shell: {{.LoginShell}}
{{end}}"""

