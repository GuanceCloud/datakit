{{.Diff}}
"""
en = """File {{.FilePath}} content has changed:
{{.Diff}}
"""

# ========== Service Change（Module ID：04） ==========
[[change]]
id = "host_change_04_01"
[change.title]
zh = "新增服务"
en = "Create Service"
[change.message]
zh = """服务 {{.ServiceName}} 已新增：
-  服务类型： {{.ServiceType}}
-  当前状态： {{.NewStatus}}
-  开机自启： {{if .NewEnabled}}是{{else}}否{{end}}
"""
en = """Service {{.ServiceName}} has been created:
-  Service Type: {{.ServiceType}}
-  Current Status: {{.NewStatus}}
-  Enabled on Boot: {{if .NewEnabled}}Yes{{else}}No{{end}}
"""

[[change]]
id = "host_change_04_02"
[change.title]
zh = "删除服务"
en = "Delete Service"
[change.message]
zh = """服务 {{.ServiceName}} 已删除：
-  服务类型： {{.ServiceType}}
-  原状态： {{.OldStatus}}
-  开机自启： {{if .OldEnabled}}是{{else}}否{{end}}
"""
en = """Service {{.ServiceName}} has been deleted:
-  Service Type: {{.ServiceType}}
-  Original Status: {{.OldStatus}}
-  Enabled on Boot: {{if .OldEnabled}}Yes{{else}}No{{end}}
"""

[[change]]
id = "host_change_04_03"
[change.title]
zh = "修改服务配置"
en = "Modify Service Configuration"
[change.message]
zh = """服务 {{.ServiceName}} 配置已变更：
-  服务类型： {{.ServiceType}}
{{if ne .OldStatus .NewStatus}}-  状态： {{.OldStatus}} → {{.NewStatus}}
{{end}}{{if ne .OldEnabled .NewEnabled}}-  开机自启： {{if .OldEnabled}}是{{else}}否{{end}} → {{if .NewEnabled}}是{{else}}否{{end}}
{{end}}{{if .ContentChanged}}-  配置文件内容已变更：
{{.DiffText}}
{{end}}"""
en = """Service {{.ServiceName}} configuration has been changed:
-  Service Type: {{.ServiceType}}
{{if ne .OldStatus .NewStatus}}-  Status: {{.OldStatus}} → {{.NewStatus}}
{{end}}{{if ne .OldEnabled .NewEnabled}}-  Enabled on Boot: {{if .OldEnabled}}Yes{{else}}No{{end}} → {{if .NewEnabled}}Yes{{else}}No{{end}}
{{end}}{{if .ContentChanged}}-  Configuration file content has changed:
{{.DiffText}}
{{end}}"""

[[change]]
id = "host_change_04_04"
[change.title]
zh = "服务状态变更"
en = "Service Status Changed"
[change.message]
zh = """服务 {{.ServiceName}} 状态已变更：
-  服务类型： {{.ServiceType}}
-  原状态： {{.OldStatus}}
-  新状态： {{.NewStatus}}
-  开机自启： {{if .NewEnabled}}是{{else}}否{{end}}
"""
en = """Service {{.ServiceName}} status has been changed:
-  Service Type: {{.ServiceType}}
-  Old Status: {{.OldStatus}}
-  New Status: {{.NewStatus}}
-  Enabled on Boot: {{if .NewEnabled}}Yes{{else}}No{{end}}
"""

# ========== Network Configuration Change（Module ID：05） ==========
[[change]]
id = "host_change_05_01"
[change.title]
zh = "网络接口变更"
en = "Network Interface Changed"
[change.message]
zh = """{{if eq .ChangeType "add"}}网络接口 {{.InterfaceName}} 已新增：
新状态： {{.NewStatus}}
新 IP： {{.NewIP}}
{{else if eq .ChangeType "delete"}}网络接口 {{.InterfaceName}} 已删除：
原状态： {{.OldStatus}}
原 IP： {{.OldIP}}
{{else}}网络接口 {{.InterfaceName}} 已修改：
{{if ne .OldStatus .NewStatus}}状态： {{.OldStatus}} → {{.NewStatus}}
{{end}}{{if ne .OldIP .NewIP}}IP 地址： {{.OldIP}} → {{.NewIP}}
{{end}}{{if eq .OldStatus .NewStatus}}{{if eq .OldIP .NewIP}}（无变化）
{{end}}{{end}}{{end}}"""
en = """{{if eq .ChangeType "add"}}Network interface {{.InterfaceName}} has been added:
New Status: {{.NewStatus}}
New IP: {{.NewIP}}
{{else if eq .ChangeType "delete"}}Network interface {{.InterfaceName}} has been deleted:
Old Status: {{.OldStatus}}
Old IP: {{.OldIP}}
{{else}}Network interface {{.InterfaceName}} has been modified:
{{if ne .OldStatus .NewStatus}}Status: {{.OldStatus}} → {{.NewStatus}}
{{end}}{{if ne .OldIP .NewIP}}IP Address: {{.OldIP}} → {{.NewIP}}
{{end}}{{if eq .OldStatus .NewStatus}}{{if eq .OldIP .NewIP}}(No change)
{{end}}{{end}}{{end}}"""

