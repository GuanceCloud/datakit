# ========== Crontab Change（Module ID：02） ==========
[[change]]
id = "host_change_02_01"
[change.title]
zh = "Crontab 任务变更"
en = "Crontab Job Changes"
[change.message]
zh = """Crontab 任务变更：
{{range $filePath, $changes := .ChangesByFile}}
文件路径： {{$filePath}}
{{if $changes.Created}}
新增任务：
{{range $index, $cron := $changes.Created}}
  -  用户： {{$cron.User}}
     计划时间： {{$cron.Schedule}}
     命令： {{$cron.Command}}
{{end}}
{{end}}
{{if $changes.Deleted}}
删除任务：
{{range $index, $cron := $changes.Deleted}}
  -  用户： {{$cron.User}}
     计划时间： {{$cron.Schedule}}
     命令： {{$cron.Command}}
{{end}}
{{end}}
{{end}}"""
en = """Crontab job changes:
{{range $filePath, $changes := .ChangesByFile}}
File Path: {{$filePath}}
{{if $changes.Created}}
Created Jobs:
{{range $index, $cron := $changes.Created}}
  -  User: {{$cron.User}}
     Schedule: {{$cron.Schedule}}
     Command: {{$cron.Command}}
{{end}}
{{end}}
{{if $changes.Deleted}}
Deleted Jobs:
{{range $index, $cron := $changes.Deleted}}
  -  User: {{$cron.User}}
     Schedule: {{$cron.Schedule}}
     Command: {{$cron.Command}}
{{end}}
{{end}}
{{end}}"""

