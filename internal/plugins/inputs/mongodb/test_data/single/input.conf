[[inputs.mongodb]]
  ## MongoDB connection parameters
  ##   example: mongodb://user:pass@127.0.0.1:27017/admin?ssl=false
  ##   see https://docs.mongodb.com/manual/reference/connection-string/
  servers = ["mongodb://admin:admin@localhost:27017/admin"]

  ## An array of MongoDB topologies to collect.
  ## Available topologies include:
  ##   servers, replica_sets, clusters
  topologies = ["servers"]

  ## The collection where the metrics are stored.
  # collection = "datakit_mongodb_metrics"

  ## Optional TLS Config
  ## Enable TLS connection to the MongoDB server.
  # tls_enable = false
  ## Path to the CA file.
  # tls_ca = "/etc/ssl/ca.pem"
  ## Path to the client cert file.
  # tls_cert = "/etc/ssl/client.pem"
  ## Path to the client key file.
  # tls_key = "/etc/ssl/client-key.pem"
  ## Insecure skip verify.
  # tls_insecure_skip_verify = true

  ## Only collect metrics from the selected databases.
  # databases = ["admin", "test"]

  ## Enable collection of per-collection metrics.
  # collect_collection_metrics = false

  ## Enable collection of per-database metrics.
  # collect_database_metrics = false

  ## Enable collection of top metrics.
  # collect_top_metrics = false

  ## Enable collection of replica set metrics.
  # collect_replica_set_metrics = false

  ## Enable collection of cluster metrics.
  # collect_cluster_metrics = false

  ## Enable collection of storage engine metrics.
  # collect_storage_engine_metrics = false

  ## Enable collection of wiredTiger metrics.
  # collect_wired_tiger_metrics = false

  ## Enable collection of mongos metrics.
  # collect_mongos_metrics = false

  ## Enable collection of replica lag metrics.
  # collect_replica_lag_metrics = false

  ## Enable collection of oplog metrics.
  # collect_oplog_metrics = false

  ## Enable collection of shard metrics.
  # collect_shard_metrics = false

  ## Enable collection of connection pool metrics.
  # collect_connection_pool_metrics = false

  ## Enable collection of collection statistics.
  # collect_collection_stats = false

  ## Enable collection of database statistics.
  # collect_database_stats = false

  ## Enable collection of server status metrics.
  # collect_server_status = true

  ## Enable collection of replica set status metrics.
  # collect_replica_set_status = false

  ## Enable collection of shard conn pool stats metrics.
  # collect_shard_conn_pool_stats = false

  ## Enable collection of cluster stats metrics.
  # collect_cluster_stats = false

  ## Enable collection of database stats metrics.
  # collect_db_stats = false

  ## Enable collection of collection stats metrics.
  # collect_col_stats = false

  ## Enable collection of top stats metrics.
  # collect_top_stats = false

  ## Enable collection of oplog stats metrics.
  # collect_oplog_stats = false

  ## Enable collection of shard stats metrics.
  # collect_shard_stats = false

  ## Enable collection of mongodb data metrics.
  # collect_data = true

  ## Interval at which to collect metrics.
  interval = "10s"