# TrueWatch DataKit Partner node-agent preset for GKE Autopilot.
# Google-managed allowlist: gke://TrueWatch/datakit/truewatch-datakit-autopilot-v2.yaml

workload:
  kind: DaemonSet

gkeAutopilot:
  enabled: false

gkeAutopilotPartner:
  enabled: true
  allowlistName: truewatch-datakit-autopilot-v2

nameOverride: datakit
fullnameOverride: datakit

datakit:
  default_enabled_inputs: dk,container
  enabled_election: true
  dataway_secret_enabled: true
  dataway_secret_name: datakit-dataway
  dataway_secret_key: ENV_DATAWAY

image:
  # V2 matches the canonical TrueWatch repository. An empty tag follows
  # Chart.appVersion, which the existing release CI sets from CI_VERSION.
  repository: pubrepo.truewatch.com/truewatch/datakit
  tag: ""
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "500m"
    memory: "500Mi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

componentHealthLivenessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 4

podAnnotations: null

serviceAccountAnnotations: {}

# Additional DataKit configuration. Partner environment variable names must
# match ^ENV_[A-Z0-9_]+$; both value and valueFrom are supported.
extraEnvs: []
