{{- $partnerConfig := .Values.gkeAutopilotPartner | default dict -}}
{{- $isAutopilotPartner := $partnerConfig.enabled | default false -}}
# templates/clusterrole.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "datakit.fullname" . }}
  labels:
    {{- include "datakit.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
rules:
  {{- if not $isAutopilotPartner }}
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  - apiGroups: [""]
    {{- if $isAutopilotPartner }}
    resources: ["nodes", "nodes/stats", "nodes/metrics", "namespaces", "pods", "events", "services", "endpoints", "persistentvolumes", "persistentvolumeclaims"]
    {{- else }}
    resources: ["nodes", "nodes/stats","nodes/metrics", "namespaces", "pods", "pods/log", "events", "services", "endpoints", "persistentvolumes", "persistentvolumeclaims", "pods/exec"]
    {{- end }}
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: [ "get", "list", "watch"]
  {{- if not $isAutopilotPartner }}
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "servicemonitors"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  - apiGroups: ["logging.datakits.io"]
    resources: ["clusterloggingconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  {{- if not $isAutopilotPartner }}
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  {{- end }}
