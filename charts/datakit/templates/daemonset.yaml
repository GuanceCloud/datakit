
{{- /* Keep this template path stable while supporting both workload kinds. */ -}}
{{- $isDeployment := eq .Values.workload.kind "Deployment" -}}
{{- $isDaemonSet := eq .Values.workload.kind "DaemonSet" -}}
{{- $isAutopilotCloud := .Values.gkeAutopilot.enabled -}}
{{- $partnerConfig := .Values.gkeAutopilotPartner | default dict -}}
{{- $isAutopilotPartner := $partnerConfig.enabled | default false -}}
{{- if not (or $isDeployment $isDaemonSet) -}}
{{- fail "workload.kind must be either DaemonSet or Deployment" -}}
{{- end -}}
{{- if and $isAutopilotCloud $isAutopilotPartner -}}
{{- fail "gkeAutopilot.enabled and gkeAutopilotPartner.enabled are mutually exclusive" -}}
{{- end -}}
{{- if and $isAutopilotCloud (not $isDeployment) -}}
{{- fail "gkeAutopilot.enabled requires workload.kind=Deployment" -}}
{{- end -}}
{{- if and $isAutopilotPartner (not $isDaemonSet) -}}
{{- fail "gkeAutopilotPartner.enabled requires workload.kind=DaemonSet" -}}
{{- end -}}
{{- if and $isAutopilotPartner (or .Values.iploc.enable .Values.dkconfig (and .Values.git_repos.enable (ne .Values.git_repos.git_key_path "-"))) -}}
{{- fail "GKE Autopilot Partner v2 does not support iploc, dkconfig mounts, or Git SSH key mounts; use extraEnvs for configuration" -}}
{{- end -}}
{{- if and $isAutopilotPartner (empty $partnerConfig.allowlistName) -}}
{{- fail "gkeAutopilotPartner.enabled requires gkeAutopilotPartner.allowlistName" -}}
{{- end }}
---
apiVersion: apps/v1
kind: {{ .Values.workload.kind }}
metadata:
  labels:
    app: {{ include "datakit.fullname" . }}
  {{- include "datakit.labels" . | nindent 4 }}
  name: {{ include "datakit.fullname" . }}
spec:
  {{- if $isDeployment }}
  replicas: {{ .Values.workload.replicas }}
  {{- end }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
  {{- include "datakit.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if $isAutopilotPartner }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}
        {{- else }}
        checksum/config: {{ randAlphaNum 5 | quote }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ include "datakit.fullname" . }}
    {{- include "datakit.selectorLabels" . | nindent 8 }}
      {{- if $isAutopilotPartner }}
        cloud.google.com/matching-allowlist: {{ $partnerConfig.allowlistName | quote }}
      {{- end }}
    spec:
      {{- if or $isAutopilotCloud $isAutopilotPartner }}
      hostNetwork: false
      dnsPolicy: ClusterFirst
      {{- else }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if and $isAutopilotCloud .Values.gkeAutopilot.runAsNonRoot }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.gkeAutopilot.runAsUser }}
        runAsGroup: {{ .Values.gkeAutopilot.runAsGroup }}
        fsGroup: {{ .Values.gkeAutopilot.fsGroup }}
      {{- end }}
      containers:
        - env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: status.hostIP
            - name: ENV_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
            - name: ENV_CLUSTER_NAME_K8S
              value: {{ .Values.datakit.cluster_name_k8s}}
            {{- if .Values.datakit.dataway_secret_enabled }}
            - name: ENV_DATAWAY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.datakit.dataway_secret_name | quote }}
                  key: {{ .Values.datakit.dataway_secret_key | quote }}
            {{- else }}
            - name: ENV_DATAWAY
              value: {{ .Values.datakit.dataway_url }}
            {{- end }}
            - name: ENV_GLOBAL_TAGS
              value: {{ .Values.datakit.global_tags }}
            - name: ENV_DEFAULT_ENABLED_INPUTS
              value: {{ .Values.datakit.default_enabled_inputs }}
            - name: ENV_ENABLE_ELECTION
              value: {{ .Values.datakit.enabled_election | quote }}
            {{- with .Values.datakit.election_operator_url }}
            - name: ENV_ELECTION_OPERATOR_URL
              value: {{ . | quote }}
            {{- end }}
            - name: ENV_LOG_LEVEL
              value: {{ .Values.datakit.log_level }}
            - name: ENV_HTTP_LISTEN
              value: {{ .Values.datakit.http_listen }}
            {{- if $isAutopilotPartner }}
            - name: HOST_ROOT
              value: /rootfs
            - name: ENV_INPUT_CONTAINER_ENDPOINTS
              value: unix:///var/run/containerd/containerd.sock
            - name: ENV_INPUT_CONTAINER_GCP_CLOUD_API_ENABLED
              value: "false"
            - name: ENV_INPUT_CONTAINER_ENABLE_K8S_NODE_LOCAL
              value: "true"
            {{- else if not $isAutopilotCloud }}
            - name: HOST_PROC
              value: /rootfs/proc
            - name: HOST_SYS
              value: /rootfs/sys
            - name: HOST_ETC
              value: /rootfs/etc
            - name: HOST_VAR
              value: /rootfs/var
            - name: HOST_RUN
              value: /rootfs/run
            - name: HOST_DEV
              value: /rootfs/dev
            - name: HOST_ROOT
              value: /rootfs
            {{- end }}
            {{- if .Values.iploc.enable }}
            - name: ENV_IPDB
              value: iploc
            {{- end }}
            {{- if .Values.git_repos.enable }}
            {{- if not (eq  "-" .Values.git_repos.git_url) }}
            - name: ENV_GIT_URL
              value: {{ .Values.git_repos.git_url }}
            {{- end }}
            {{- if not (eq "-" .Values.git_repos.git_key_path ) }}
            - name: ENV_GIT_KEY_PATH
              value: "/usr/local/datakit/id_rsa"
            {{- end }}
            {{- if not (eq .Values.git_repos.git_key_pw "-") }}
            - name: ENV_GIT_KEY_PW
              value: {{ .Values.git_repos.git_key_pw | quote  }}
            {{- end }}
            - name: ENV_GIT_BRANCH
              value: {{ .Values.git_repos.git_branch | quote }}
            - name: ENV_GIT_INTERVAL
              value: {{ .Values.git_repos.git_interval | quote  }}
            {{- end }}
            {{- with .Values.extraEnvs }}
            {{- if $isAutopilotPartner }}
            {{- range . }}
            {{- if not (regexMatch "^ENV_[A-Z0-9_]+$" (.name | default "")) }}
            {{- fail "gkeAutopilotPartner extraEnvs names must match ^ENV_[A-Z0-9_]+$" }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range . }}
            - name: {{ .name }}
            {{- if and $isAutopilotPartner (hasKey . "valueFrom") }}
              valueFrom:
              {{- toYaml .valueFrom | nindent 16 }}
            {{- else }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $isAutopilotPartner }}
          name: datakit
          {{- else }}
          name: {{ .Chart.Name }}
          {{- end }}
          ports:
          - containerPort: {{.Values.service.port }}
            name: {{.Values.service.targetPortName }}
            protocol: TCP
          - containerPort: {{.Values.statsd.port }}
            name: {{.Values.statsd.targetPortName }}
            protocol: UDP
          - containerPort: {{ .Values.otelGRPC.port }}
            name: {{ .Values.otelGRPC.targetPortName}}
            protocol: TCP
          - containerPort: {{ .Values.logfwdServer.port }}
            name: {{ .Values.logfwdServer.targetPortName}}
            protocol: TCP
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- if .Values.componentHealthLivenessProbe }}
          {{- if and .Values.componentHealthLivenessProbe.enabled (not $isAutopilotCloud) }}
          livenessProbe:
            httpGet:
              path: /v1/health
              port: {{ .Values.service.targetPortName }}
              scheme: HTTP
            initialDelaySeconds: {{ .Values.componentHealthLivenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.componentHealthLivenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.componentHealthLivenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.componentHealthLivenessProbe.failureThreshold }}
          {{- end }}
          {{- end }}
          {{- if or $isAutopilotCloud $isAutopilotPartner }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- else }}
          securityContext:
            privileged: true
          {{- end }}
          volumeMounts:
            {{- if $isAutopilotPartner }}
            - mountPath: /var/run/containerd
              name: containerd
              readOnly: true
            - mountPath: /rootfs/proc
              name: proc
              readOnly: true
            - mountPath: /rootfs/var/log/pods
              name: pod-logs
              readOnly: true
            - mountPath: /usr/local/datakit/cache
              name: cache
              readOnly: false
            {{- else if $isAutopilotCloud }}
            - mountPath: /usr/local/datakit/cache
              name: cache
              readOnly: false
            {{- else }}
            - mountPath: /var/run
              name: run
            - mountPath: /rootfs
              name: rootfs
            - mountPath: /sys/kernel/debug
              name: debugfs
            - mountPath: /usr/local/datakit/cache
              name: cache
              readOnly: false
            {{- end }}
            {{- if .Values.iploc.enable }}
            - mountPath: /usr/local/datakit/data/ipdb/iploc/
              name: datakit-ipdb
            {{- end }}
            {{- if .Values.git_repos.enable }}
            {{- if not (eq .Values.git_repos.git_key_path "-") }}
            - mountPath: /usr/local/datakit/id_rsa
              name: id-rsa
              subPath: id_rsa
            {{- end }}
            {{- end }}
            {{- if .Values.dkconfig }}
            {{- range $index, $vaule := .Values.dkconfig }}
            {{- with $vaule }}
            - mountPath: {{ .path }}
              name: datakit-conf
              subPath: {{ .name }}
          {{- end }}
          {{- end }}
          {{- end }}
          workingDir: /usr/local/datakit
      {{- if or $isAutopilotCloud $isAutopilotPartner }}
      hostIPC: false
      hostPID: false
      {{- else }}
      hostIPC: true
      hostPID: true
      {{- end }}
      restartPolicy: Always
      {{- if .Values.iploc.enable }}
      initContainers:
        - args:
            - tar -xf /opt/iploc.tar.gz -C /usr/local/datakit/data/ipdb/iploc/
          command:
            - bash
            - -c
          image: {{ .Values.iploc.image.repository }}:{{ .Values.iploc.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: IfNotPresent
          name: init-volume
          resources: {}
          volumeMounts:
            - mountPath: /usr/local/datakit/data/ipdb/iploc/
              name: datakit-ipdb
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.image.imagePullSecrets }}
      imagePullSecrets: {{ toYaml .Values.image.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccount: {{ include "datakit.fullname" . }}
      serviceAccountName: {{ include "datakit.fullname" . }}
      volumes:
        {{- if $isAutopilotPartner }}
        - hostPath:
            path: /var/run/containerd
            type: Directory
          name: containerd
        - hostPath:
            path: /proc
            type: Directory
          name: proc
        - hostPath:
            path: /var/log/pods
            type: Directory
          name: pod-logs
        - emptyDir: {}
          name: cache
        {{- else if $isAutopilotCloud }}
        - emptyDir: {}
          name: cache
        {{- else }}
        - hostPath:
            path: /var/run
          name: run
        - hostPath:
            path: /
          name: rootfs
        - hostPath:
            path: {{ .Values.datakit.cache.mountPath }}
          name: cache
        - hostPath:
            path: /sys/kernel/debug
          name: debugfs
        {{- end }}
        {{- if .Values.iploc.enable }}
        - emptyDir: {}
          name: datakit-ipdb
        {{- end }}
        {{- if .Values.git_repos.enable }}
        {{- if not (eq .Values.git_repos.git_key_path "-") }}
        - configMap:
            name: id-rsa
          name: id-rsa
        {{- end }}
        {{- end }}
        {{- if .Values.dkconfig }}
        - configMap:
            name: datakit-conf
          name: datakit-conf
        {{- end }}
  {{- if $isDeployment }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  {{- else }}
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  {{- end }}
