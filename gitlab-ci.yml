variables:
  PROJECT: "datakit"
  CI_VERSION: "1.90.0"
  CI_TESTING_VERSION: $CI_VERSION-testing_$CI_COMMIT_BRANCH
  DCA_CI_VERSION: "0.1.6"
  DCA_CI_TESTING_VERSION: $DCA_CI_VERSION-testing_$CI_COMMIT_BRANCH
  DISABLED_MR_TARGET_BRANCHES: "/^master|main/"
  DISABLED_MR_TITLE: '/^(\[Draft\]|\(Draft\)|Draft:)/'
  FLAMESHOT_VERSION: "0.2.1"
  FLAMESHOT_TESTING_VERSION: $FLAMESHOT_VERSION-testing_$CI_COMMIT_BRANCH
  DK_GO_VERSION: "1.19.12"
  GOLANGCI_LINT_VERSION: "v1.46.2"
  GOLANGCI_LINT_BIN: "./bin/golangci-lint"

before_script:
  - uname -a
  - echo $DK_BPF_KERNEL_SRC_PATH
  - echo $CC_HTTP_PROXY
  - env | grep ^OSS_
  - |
    export GO_DIST_ARCH="$(uname -m)"
    if [ "$GO_DIST_ARCH" = "x86_64" ] || [ "$GO_DIST_ARCH" = "amd64" ]; then
      export GO_DIST_ARCH="amd64"
    elif [ "$GO_DIST_ARCH" = "aarch64" ] || [ "$GO_DIST_ARCH" = "arm64" ]; then
      export GO_DIST_ARCH="arm64"
    else
      echo "unsupported architecture: $GO_DIST_ARCH"
      exit 1
    fi
    export GO_VERSION_NORMALIZED="${DK_GO_VERSION#go}"
    export GO_DIST_TARBALL="go${GO_VERSION_NORMALIZED}.linux-${GO_DIST_ARCH}.tar.gz"
    export GO_DIST_URL="https://dl.google.com/go/${GO_DIST_TARBALL}"
    export GO_CACHE_ROOT="/tmp/datakit-ci/go"
    export GOROOT="${GO_CACHE_ROOT}/${GO_VERSION_NORMALIZED}"
    mkdir -p "$GO_CACHE_ROOT"
    rm -rf "$GOROOT"
    echo "download golang from $GO_DIST_URL"
    https_proxy="$CC_HTTP_PROXY" curl -sSfL "$GO_DIST_URL" -o "${GO_CACHE_ROOT}/${GO_DIST_TARBALL}"
    tar -C "$GO_CACHE_ROOT" -xzf "${GO_CACHE_ROOT}/${GO_DIST_TARBALL}"
    mv "${GO_CACHE_ROOT}/go" "$GOROOT"
    export PATH="$GOROOT/bin:$PATH"
  - go version
  - https_proxy="$CC_HTTP_PROXY" curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | https_proxy="$CC_HTTP_PROXY" sh -s -- -b ./bin ${GOLANGCI_LINT_VERSION}
  # Install systemd development headers for journald collector (CGO dependency)
  # Use non-interactive mode and prevent service restarts to avoid CI job termination
  - if command -v apt-get >/dev/null 2>&1; then export DEBIAN_FRONTEND=noninteractive && printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d && chmod +x /usr/sbin/policy-rc.d && apt-get update -qq && apt-get install -y -qq --no-install-recommends libsystemd-dev; rm -f /usr/sbin/policy-rc.d; elif command -v yum >/dev/null 2>&1; then yum install -y systemd-devel; elif command -v apk >/dev/null 2>&1; then apk add --no-cache systemd-dev; fi

stages:
  - _test_guance
  - _deploy_ebpf_guance
  - _deploy_guance
  - _deploy_ebpf_truewatch
  - _deploy_truewatch

# run lint and unit test for most of the branches
ci_lint_and_ut:
  stage: _deploy_guance
  resource_group: production
  rules:
    # No pipeline when there is a MR whose title starts with Draft
    # Disable merge request to master/main branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/
      when: never

    # Trigger a pipeline in case of MR event, which means the MR is ready, since we did not go through the first case
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

  script:
    - nvm use v16.14.0
    - make clean
    - make detect_mr_target_branch MERGE_REQUEST_TARGET_BRANCH="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - make local # build binary
    - make lint GOLINT_BINARY="$GOLANGCI_LINT_BIN" AUTO_FIX=false
    - make ut DATAWAY_URL="$TESTING_METRIC_DATAWAY" UT_EXCLUDE="$UT_EXCLUDE" UT_ONLY="$UT_ONLY" UT_PARALLEL="$UT_PARALLEL"
  tags:
    - cloudcare-ft

ut-datakit-production:
  stage: _test_guance
  resource_group: production
  only:
    - master
  script:
    - nvm use v16.14.0
    - make clean
    - make production_notify GIT_BRANCH=$CI_COMMIT_BRANCH VERSION="$CI_VERSION"
    - make lint GOLINT_BINARY="$GOLANGCI_LINT_BIN" AUTO_FIX=false
    - make ut DATAWAY_URL="$TESTING_METRIC_DATAWAY" UT_EXCLUDE="$UT_EXCLUDE" UT_PARALLEL="$UT_PARALLEL"
  tags:
    - cloudcare-ft

ut-datakit-testing:
  stage: _test_guance
  resource_group: production
  only:
    - testing
    - /^testing-.*$/
  script:
    - nvm use v16.14.0
    - make clean
    - make testing_notify GIT_BRANCH=$CI_COMMIT_BRANCH VERSION="$CI_TESTING_VERSION"
    #- make lint GOLINT_BINARY="$GOLANGCI_LINT_BIN" AUTO_FIX=false
    #- make ut DATAWAY_URL="$TESTING_METRIC_DATAWAY" UT_EXCLUDE="$UT_EXCLUDE"
  tags:
    - cloudcare-ft

release-ebpf-amd64-testing-guance:
  stage: _deploy_ebpf_guance
  resource_group: production
  needs: [ut-datakit-testing]
  image: pubrepo.jiagouyun.com/ebpf-dev/datakit-developer:1.9
  only:
    - testing
    - /^testing-.*$/
  script:
    - make clean
    - export OSS_HOST="$OSS_HOST_TESTING"
    - export OSS_BUCKET="$OSS_BUCKET_TESTING"
    - export OSS_ACCESS_KEY="$OSS_ACCESS_KEY_TESTING"
    - export OSS_SECRET_KEY="$OSS_SECRET_KEY_TESTING"
    - export OSS_PATH="datakit"
    - make pub_ebpf_testing DATAKIT_EBPF_ARCHS="linux/amd64" \
      GIT_BRANCH="$CI_COMMIT_BRANCH" \
      ONLY_BUILD_INPUTS_EXTENTIONS=1 \
      VERSION="$CI_TESTING_VERSION"
